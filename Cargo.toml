[package]
name = "ai-catalog-cli"
description = "Command-line tool for inspecting, validating, and packaging AI Catalog documents"
keywords = ["ai", "catalog", "cli", "oci", "validation"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Agent-Card/ai-catalog-cli"
rust-version = "1.95"

[[bin]]
name = "ai-catalog"
path = "src/main.rs"

[dependencies]
ai-catalog = "0.2.0"
ai-catalog-oci = "0.2.0"
ai-catalog-trust = "0.2.0"
ai-catalog-validate = "0.2.0"
async-recursion = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
dirs = "5"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tempfile = "3"
