---
name: release-binaries

# release-plz creates the tag and the GitHub release; this only attaches assets.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: "${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu.2.28
            archive: linux-amd64-gnu
            build-tool: cargo-zigbuild
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu.2.28
            archive: linux-arm64-gnu
            build-tool: cargo-zigbuild
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: linux-amd64-musl
            build-tool: cargo-zigbuild
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            archive: linux-arm64-musl
            build-tool: cargo-zigbuild
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: windows-amd64
            build-tool: cargo
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: windows-arm64
            build-tool: cargo
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: darwin-amd64
            build-tool: cargo
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: darwin-arm64
            build-tool: cargo
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ai-catalog
          target: ${{ matrix.platform.target }}
          archive: ai-catalog-${{ matrix.platform.archive }}
          build-tool: ${{ matrix.platform.build-tool }}
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md
          token: ${{ secrets.GITHUB_TOKEN }}

  sign-binaries:
    name: Sign binaries
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless signing exchanges this token for a short-lived Sigstore
      # certificate, so no private key is stored anywhere.
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir archives --pattern '*.tar.gz' --pattern '*.zip'

          cd archives
          for archive in *.tar.gz *.zip; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" ./*.sigstore.json

  homebrew-formula:
    name: Homebrew formula
    needs: build-binaries
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/homebrew-formula.yaml
    with:
      tag: ${{ github.event.release.tag_name }}

  winget-manifests:
    name: WinGet manifests
    needs: build-binaries
    permissions:
      contents: read
    uses: ./.github/workflows/winget-manifests.yaml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      publish: true
    secrets:
      PROJECT_APP_ID: ${{ secrets.PROJECT_APP_ID }}
      PROJECT_APP_KEY: ${{ secrets.PROJECT_APP_KEY }}
